# Default training config. CLI flags override these values.

tokenizer: digit
steps: 20000
batch_size: 1
seq_len: 512

num_value_bins: 512
num_param_bins: 128
num_w_bins: 128

model_dim: 128
hidden_dim: 512
num_heads: 4
num_layers: 4
dropout: 0.1

lr: 0.0006
warmup_steps: 1000
min_lr: 0.00006
weight_decay: 0.01

eval_specs: 128
eval_batch_size: 1
eval_every: 500
generate_every: 1000
generate_specs: 4
generate_samples: 64
temperature: 1.0
top_k: 0
checkpoint_every: 5000
log_every: 50

seed: 0
out_dir: artifacts/digit_decoder_512

wandb: false
wandb_project: llm-probs

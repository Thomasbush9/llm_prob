[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-probs"
version = "0.1.0"
description = "Probing how small Transformers represent simple probability distributions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.12.0",
    "numpy>=2.4.6",
    "scipy>=1.14",
    "matplotlib>=3.10.9",
    "tqdm>=4.67.3",
    "ipykernel>=7.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_prob"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-probs"
version = "0.1.0"
description = "Probing how small Transformers represent simple probability distributions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "tqdm>=4.67.3",
    "ipykernel>=7.2.0",
    "transformers>=5.9.0",
    "accelerate>=1.13.0",
    "huggingface-hub>=1.16.1",
    "safetensors>=0.7.0",
    "transformer-lens>=3.2.1",
    "nvidia-cusparselt-cu12>=0.8.1",
    "scipy>=1.17.1",
    "numpy>=2.4,<2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_prob"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]


